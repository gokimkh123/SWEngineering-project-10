# 찰칵부산 웹 서버 (설계서 2.5: React 정적 파일 + API 프록시)
# 바깥 접속은 Cloudflare 터널(tunnel 컨테이너)로만 들어온다. 이 파일은 http 블록 안에 포함된다.
server_tokens off;

# 실제 접속자 IP = 터널이 넣어 주는 CF-Connecting-IP (도커 내부망에서 온 요청만 그 값을 믿음)
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header CF-Connecting-IP;

# 접속자 IP별 요청 한도 (NFR-08): 일반 API · 쓰기 요청 · GPU를 쓰는 요청(분석·여행기) · 사진 업로드
map $request_method $write_ip { GET ""; HEAD ""; OPTIONS ""; default $binary_remote_addr; }
limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
limit_req_zone $write_ip zone=write:10m rate=2r/s;
limit_req_zone $write_ip zone=heavy:10m rate=6r/m;
limit_req_zone $write_ip zone=upload:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;
# 한도 초과 기록은 남기지 않음(오류 기록에는 요청 줄 전체가 들어가 썸네일 주소의 기기 토큰이 남을 수 있음)
limit_req_log_level info;
limit_conn_log_level info;

# 요청 기록은 쿼리 없이(썸네일 주소의 ?t=기기 토큰을 남기지 않음)
log_format chalkak '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent ${request_time}s in=$request_length';

upstream chalkak_api {
  server api:8000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  access_log /dev/stdout chalkak;
  error_log /dev/stderr warn;
  root /usr/share/nginx/html;
  include /etc/nginx/snippets/security-headers.conf;

  client_max_body_size 1m;        # 업로드 주소만 따로 크게
  client_body_timeout 60s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  limit_conn perip 40;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 120s;

  # nginx가 거절한 요청도 화면이 읽을 수 있게 JSON으로 (API 응답의 429·413은 그대로 통과)
  charset utf-8;
  error_page 429 = @too_many;
  error_page 413 = @too_large;
  location @too_many {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/json;
    return 429 '{"detail":"요청이 너무 잦아요. 잠시 후 다시 시도해 주세요."}';
  }
  location @too_large {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/json;
    return 413 '{"detail":"한 번에 보낸 사진이 너무 커요. 사진을 나눠서 올려 주세요."}';
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # 사진 업로드 (FR-01): 화면이 몇 장씩 나눠 보냄. 한 요청 45MB까지 (Cloudflare 무료 한도 100MB 안쪽)
  location ~ ^/api/v1/trips/[A-Za-z0-9]+/photos$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    client_max_body_size 45m;
    client_body_buffer_size 1m;
    limit_req zone=upload burst=12 nodelay;
    limit_req zone=api burst=40 nodelay;
    proxy_request_buffering on;
    proxy_pass http://chalkak_api;
  }

  # GPU를 쓰는 요청: 여행 만들기 · 분석 시작 · 여행기 만들기 · 문단 다시 쓰기 · 공유 카드 (쓰기만 제한, 조회는 아래 일반 한도)
  location ~ ^/api/v1/(trips|trips/[A-Za-z0-9]+/analysis|trips/[A-Za-z0-9]+/stories|stories/[A-Za-z0-9]+/paragraphs/[A-Za-z0-9]+/rewrite|stories/[A-Za-z0-9]+/share-card)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    limit_req zone=heavy burst=6 nodelay;
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://chalkak_api;
  }

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    limit_req zone=api burst=40 nodelay;
    limit_req zone=write burst=20 nodelay;
    proxy_pass http://chalkak_api;
  }

  # 빌드 결과(파일 이름에 해시가 붙음)는 오래 캐시
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
