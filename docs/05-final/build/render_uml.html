<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Pretendard"; src: url("Pretendard-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "Pretendard"; src: url("Pretendard-Bold.ttf"); font-weight: 700; }
body { margin: 0; background: #fff; font-family: "Pretendard"; }
#out { display: inline-block; padding: 18px; background: #fff; }
</style>
<script src="node_modules/mermaid/dist/mermaid.min.js"></script>
</head><body><div id="out"></div>
<script>
window.renderDiagram = async (code, cfg) => {
  await document.fonts.load('20px "Pretendard"'); await document.fonts.load('bold 20px "Pretendard"');
  mermaid.initialize(Object.assign({ startOnLoad: false, securityLevel: 'loose' }, cfg));
  const { svg } = await mermaid.render('d' + Math.random().toString(36).slice(2), code);
  document.getElementById('out').innerHTML = svg;
  const el = document.querySelector('#out svg');
  el.style.maxWidth = 'none';
  return [el.getBoundingClientRect().width, el.getBoundingClientRect().height];
};
</script></body></html>
